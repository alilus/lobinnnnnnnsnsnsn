<html lang="es">
<head>
    <meta name="robots" content="noindex" />
    <script src="https://content.jwplatform.com/libraries/KB5zFt7A.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/5.0/crypto-js.min.js"></script>
    <script> jwplayer.key='XSuP4qMl+9tK17QNb+4+th2Pm9AWgMO/cYH8CI0HGGr7bdjo'; </script>

    <script>
        function getParameterByName(name) {
            name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
            var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
                results = regex.exec(location.search);
            return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }

        var getURL = getParameterByName('url');
        var getIMG = getParameterByName('img');
        var getKEY = getParameterByName('k1');
        var getKEY2 = getParameterByName('k2');
    </script>

    <style>
        /* --- Pantalla completa, sin márgenes --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #player {
            width: 100vw;
            height: 100vh;
        }
        /* Opcional: forzar que el video se estire aún más (por si acaso) */
        #player video {
            object-fit: fill !important; /* refuerzo para el fill */
        }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        var playerInstance = jwplayer("player");

        playerInstance.setup({
            playlist: [{
                "title": "DZA SPORTS",
                "description": "EN VIVO",
                "image": getIMG,
                "sources": [{
                    "default": false,
                    "type": "dash",
                    "file": atob(getURL),
                    "drm": {
                        "clearkey": {
                            "keyId": atob(getKEY),
                            "key": atob(getKEY2)
                        }
                    },
                    "label": "0"
                }]
            }],
            width: "100%",
            height: "100%",
            // aspectratio: "16:9",   // ← ELIMINADO para que no limite
            stretching: "exactfit",    // ← CLAVE: estira el video para llenar (distorsiona)
            autostart: true,           // ← Opcional: inicia automáticamente
            cast: {},
            sharing: {}
        });

        // (Opcional) Pide pantalla completa al hacer clic en el reproductor
        document.getElementById('player').addEventListener('click', function() {
            if (this.requestFullscreen) {
                this.requestFullscreen().catch(() => {});
            }
        });
    </script>
</body>
</html>
